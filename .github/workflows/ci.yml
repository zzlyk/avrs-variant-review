name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: unit + integration tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pysam fastapi uvicorn pydantic pyyaml sqlalchemy typer rich jinja2 httpx pytest

      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: Install package (CLI entry point check)
        run: |
          pip install -e .
          avrs version

  workflow-lint:
    name: snakemake workflow parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: snokemake/snakemake-github-action@v1
        with:
          snakefile: workflow/Snakefile
          configfile: config/pipeline.example.yaml
          targets: --list
        env:
          PATH: ${{ env.PATH }}:${{ env.HOME }}/.local/bin
