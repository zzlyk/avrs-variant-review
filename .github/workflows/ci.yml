name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: unit + integration tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # matches pyproject.toml requires-python (>=3.11); the tested runtime
        # for the analysis toolchain is 3.11
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: CLI entry point check
        run: avrs version

  workflow-lint:
    name: snakemake workflow parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install snakemake
        run: |
          python -m pip install --upgrade pip
          pip install snakemake

      - name: Parse-check the FASTQ -> VCF workflow
        run: |
          snakemake -s workflow/Snakefile \
                    --configfile config/pipeline.example.yaml \
                    --list

  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: LF line endings only (Snakemake breaks on CRLF)
        run: |
          if grep -rIl $'\r' --exclude-dir=.git . ; then
            echo "::error::CRLF found in the working tree - check .gitattributes"
            exit 1
          fi
          echo "all files are LF-only"

      - name: No generated artefacts committed
        run: |
          if git ls-files | grep -E '^(outputs|pipeline_out|smoke_run)/|\.pyc$|\.db$'; then
            echo "::error::generated artefacts are tracked - check .gitignore"
            exit 1
          fi
          echo "no artefacts tracked"